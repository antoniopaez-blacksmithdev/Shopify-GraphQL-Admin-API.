# Español 🇪🇸

# QUÉ HACE A NIVEL GLOBAL:
# Consulta un canal de venta / publicación (Online Store, Point of Sale, un
# marketplace, un catálogo B2B...) y lista qué productos están publicados en él,
# con sus variantes y el identificador de inventario de cada una.
# Responde a: "¿qué catálogo ve realmente este canal?".

query PublicationProductVariants($publicationId: ID!) {
  # Carga la publicación por su GID. Una publicación es el vínculo entre la
  # tienda y un canal o catálogo concreto.
  # OJO: el ID de publicación NO es el de canal
  # (gid://shopify/Publication/... vs gid://shopify/Channel/...);
  # pasar el segundo devuelve null.
  publication(id: $publicationId) {
    id

    # Solo los productos ASOCIADOS a esta publicación: es el filtro implícito
    # de toda la query. El mismo producto puede estar en un canal y no en otro.
    products(first: 5) {
      nodes {
        id
        title

        # Variantes de cada producto publicado.
        # sortKey (ProductVariantSortKeys): FULL_TITLE | ID |
        #   INVENTORY_LEVELS_AVAILABLE | INVENTORY_MANAGEMENT | INVENTORY_POLICY |
        #   INVENTORY_QUANTITY | NAME | POPULAR | POSITION | RELEVANCE | SKU | TITLE
        variants(first: 5) {
          nodes {
            id
            title

            # Aquí solo se pide el ID, sin bajar a inventoryLevels: identifica el
            # registro de inventario para cruzarlo después con otra query o con un
            # sistema externo, sin pagar el coste de recorrer ubicaciones.
            inventoryItem {
              id
            }
          }
        }
      }
    }
  }
}

# MATIZ: publicado != visible. Un producto puede estar en la publicación pero con
# status DRAFT o con fecha de publicación futura. Para el estado real:
# Product.publishedOnPublication(publicationId:) o Product.resourcePublications.


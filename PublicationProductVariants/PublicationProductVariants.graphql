# English 🏴󠁧󠁢󠁥󠁮󠁧󠁿

# WHAT IT DOES AT A GLOBAL LEVEL:
# Queries a sales channel / publication (Online Store, Point of Sale, a
# marketplace, a B2B catalog...) and lists which products are published on it,
# along with their variants and the inventory identifier of each one.
# Answers: "what catalog does this channel actually see?".

query PublicationProductVariants($publicationId: ID!) {
  # Loads the publication by its GID. A publication is the link between the
  # store and a specific channel or catalog.
  # WATCH OUT: the publication ID is NOT the channel ID
  # (gid://shopify/Publication/... vs gid://shopify/Channel/...);
  # passing the latter returns null.
  publication(id: $publicationId) {
    id

    # Only the products ASSOCIATED with this publication: it is the implicit
    # filter of the whole query. The same product may be on one channel and not another.
    products(first: 5) {
      nodes {
        id
        title

        # Variants of each published product.
        # sortKey (ProductVariantSortKeys): FULL_TITLE | ID |
        #   INVENTORY_LEVELS_AVAILABLE | INVENTORY_MANAGEMENT | INVENTORY_POLICY |
        #   INVENTORY_QUANTITY | NAME | POPULAR | POSITION | RELEVANCE | SKU | TITLE
        variants(first: 5) {
          nodes {
            id
            title

            # Here only the ID is requested, without going down to inventoryLevels:
            # it identifies the inventory record so you can cross-reference it later
            # with another query or an external system, without paying the cost of
            # walking through locations.
            inventoryItem {
              id
            }
          }
        }
      }
    }
  }
}

# NUANCE: published != visible. A product can be in the publication but with
# status DRAFT or with a future publication date. For the real status:
# Product.publishedOnPublication(publicationId:) or Product.resourcePublications.
# Español 🇪🇸

# QUÉ HACE A NIVEL GLOBAL:
# Única query de la serie sin parámetros. Ataca la conexión raíz `collections` y
# devuelve un mapa de estructura del catálogo: las 5 primeras colecciones, sus
# productos, las variantes de cada producto y el ID de inventario de cada una.
# No mira cantidades: sirve para entender CÓMO está organizado el catálogo,
# no cuánto stock hay.

query CollectionCatalogFamily {
  # Entrada por la raíz (QueryRoot), sin ID: devuelve colecciones de la tienda
  # en lugar de una concreta. Por eso el bloque de parámetros es {}.
  # Admite además: sortKey, reverse, query, savedSearchId, after/before/last.
  # sortKey (CollectionSortKeys) solo acepta 4 valores:
  #   ID | RELEVANCE | TITLE | UPDATED_AT   (aquí NO existe CREATED_AT)
  # `query` permite filtrar, p. ej.:
  #   query: "collection_type:smart"  o  query: "title:Rebajas*"
  collections(first: 5) {
    nodes {
      id
      title

      # Mismo descenso jerárquico que el Día 1, pero cortando antes de
      # inventoryLevels: estructura del catálogo, sin cantidades.
      # sortKey (ProductCollectionSortKeys): BEST_SELLING | COLLECTION_DEFAULT |
      #   CREATED | ID | MANUAL | PRICE | RELEVANCE | TITLE
      products(first: 5) {
        nodes {
          id
          title

          variants(first: 5) {
            nodes {
              id
              title

              # Solo el ID del registro de inventario asociado a la variante.
              inventoryItem {
                id
              }
            }
          }
        }
      }
    }
  }
}

# NOTA DE COSTE: es la query con más riesgo de la serie (5 x 5 x 5 nodos anidados).
# Subir los `first` a 50 en cada nivel dispara el coste calculado y provoca
# THROTTLED aunque el volumen de datos real sea pequeño.


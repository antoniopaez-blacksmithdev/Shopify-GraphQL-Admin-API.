# Español 🇪🇸

# QUÉ HACE A NIVEL GLOBAL:
# Sobre un pedido concreto, lista sus órdenes de fulfillment (el trabajo de
# preparación/envío que Shopify genera automáticamente, agrupado por ubicación
# de origen) y, dentro de cada una, qué unidades siguen sin enviarse.
# Responde a: "¿qué queda por preparar de este pedido y desde dónde?".
# CONCEPTO CLAVE: FulfillmentOrder = trabajo previsto.
#                 Fulfillment      = envío ya realizado. Son objetos distintos.

query OrderFulfillmentPendingItems($orderId: ID!) {
  # Carga el pedido por su GID.
  order(id: $orderId) {
    id
    name # Número visible del pedido (#1001)

    # Órdenes de fulfillment del pedido. Un mismo pedido genera VARIAS si los
    # artículos salen de ubicaciones distintas o los gestionan servicios de
    # fulfillment diferentes. No se crean a mano: las genera Shopify.
    # Admite además: includeClosed (Boolean, por defecto false), query,
    # after/before/first/last.
    # IMPORTANTE: con el valor por defecto NO se devuelven las órdenes ya
    # cerradas. Para el histórico completo usa includeClosed: true.
    fulfillmentOrders(first: 5) {
      nodes {
        id

        # Estado del trabajo de fulfillment (enum FulfillmentOrderStatus,
        # es de salida: se lee, no se pasa como argumento).
        # VALORES POSIBLES:
        #   OPEN        -> listo para preparar
        #   IN_PROGRESS -> en proceso
        #   SCHEDULED   -> diferido, estará listo tras la fecha de fulfillAt
        #   ON_HOLD     -> retenido, no se puede iniciar hasta liberar la retención
        #   INCOMPLETE  -> no se puede completar tal como se pidió
        #   CLOSED      -> completado y cerrado
        #   CANCELLED   -> cancelado por el comerciante
        status

        # OJO: aquí son FulfillmentOrderLineItem, NO los LineItem del pedido.
        # Representan el trabajo pendiente, no la venta.
        lineItems(first: 5) {
          nodes {
            id

            # Campo clave: unidades de esta línea que todavía NO se han enviado
            # ni cancelado. Si vale 0, la línea ya está resuelta.
            remainingQuantity

            # Enlace de vuelta a la línea original del pedido, que conserva el
            # nombre comercial tal y como se vendió.
            lineItem {
              id
              name

              # Variante asociada. Anulable si el producto ya no existe.
              variant {
                id
                title
              }
            }
          }
        }
      }
    }
  }
}


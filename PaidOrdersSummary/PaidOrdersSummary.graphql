# English 🏴󠁧󠁢󠁥󠁮󠁧󠁿

# WHAT IT DOES AT A GLOBAL LEVEL:
# Searches for up to five orders matching $query.
# Returns operational data, financial status, the shop-currency total,
# and the associated customer’s visible identity when the order has one.

query PaidOrdersSummary($query: String!) {
  # QueryRoot entry point for searching orders.
  orders(first: 5, query: $query) {
    # `nodes` directly contains the orders that were found.
    nodes {
      # Global identifier in the gid://shopify/Order/... format.
      id
      # Human-readable order name, such as #1001.
      name
      # Order creation date and time in ISO 8601 format.
      createdAt
      # Aggregated financial status displayed to the merchant.
      displayFinancialStatus
      # Money bag that can contain values in different currencies.
      totalPriceSet {
        # Amount expressed in the shop’s primary currency.
        shopMoney {
          # Decimal value serialized as a String by GraphQL.
          amount
          # ISO 4217 currency code, such as USD or EUR.
          currencyCode
        }
      }
      # Associated customer; it can be null for orders without a registered customer.
      customer {
        # Customer global identifier.
        id
        # Name Shopify displays for the customer.
        displayName
      }
    }
  }
}

# Replace `query` with a valid order search expression. The `first: 5` argument limits the response and does not mean that all matching orders are retrieved.
# English 🏴󠁧󠁢󠁥󠁮󠁧󠁿

# WHAT IT DOES AT A GLOBAL LEVEL:
# Starts from a specific collection (identified by its ID) and walks four levels
# down the catalog hierarchy until it reaches the actual stock:
# collection -> products -> variants -> inventory record -> stock per location.
# Returns, for each size/color, how many units are in each warehouse or store.

query CollectionProductInventory($collectionId: ID!) {
  # Entry point: looks up ONE collection by its GID.
  # Returns null if the ID doesn't exist or the app has no permission over it.
  collection(id: $collectionId) {
    id # Global identifier (gid://shopify/Collection/...)
    title # Display name of the collection

    # Paginated connection: the first 5 products in the collection.
    # `first` is mandatory on Shopify connections (there is no "fetch them all").
    # It also accepts: sortKey, reverse, query, after/before/last.
    # sortKey (ProductCollectionSortKeys): BEST_SELLING | COLLECTION_DEFAULT |
    #   CREATED | ID | MANUAL | PRICE | RELEVANCE | TITLE
    products(first: 5) {
      # `nodes` is the modern shortcut that avoids writing edges { node { ... } }.
      # If you need cursors for pagination, use edges { cursor node } + pageInfo.
      nodes {
        id
        title

        # The first 5 variants of the product (size, color, etc.).
        # sortKey (ProductVariantSortKeys): FULL_TITLE | ID |
        #   INVENTORY_LEVELS_AVAILABLE | INVENTORY_MANAGEMENT | INVENTORY_POLICY |
        #   INVENTORY_QUANTITY | NAME | POPULAR | POSITION | RELEVANCE | SKU | TITLE
        variants(first: 5) {
          nodes {
            id
            title

            # Object that links the variant to the inventory system.
            # A variant has exactly ONE InventoryItem.
            inventoryItem {
              id

              # Up to 10 locations where that item is stocked.
              # An InventoryLevel is the intersection "one item x one location".
              inventoryLevels(first: 10) {
                nodes {
                  id

                  # Which warehouse or store this inventory level belongs to.
                  location {
                    id
                    name
                  }

                  # Inventory states you want to read. Returns name/quantity pairs.
                  # `names` are Strings (not an enum): a misspelled name is an API error.
                  # ALLOWED VALUES (all 8, and you can request them all at once):
                  #   available       -> available to sell
                  #   incoming        -> on its way from a supplier or transfer
                  #   committed       -> committed to orders not yet prepared
                  #   reserved        -> set aside (draft orders, checkouts)
                  #   damaged         -> damaged
                  #   safety_stock    -> safety stock
                  #   quality_control -> in quality control
                  #   on_hand         -> total physical = available + committed + reserved
                  #                      + damaged + safety_stock + quality_control
                  # Example: quantities(names: ["available", "on_hand", "committed"])
                  # Requires the read_inventory scope.
                  quantities(names: ["available"]) {
                    name
                    quantity
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

# COST NOTE: nesting multiplies the cost of the query (5 x 5 x 10).
# `first` accepts up to 250, but raising it across several levels causes THROTTLED.
# English 🏴󠁧󠁢󠁥󠁮󠁧󠁿

# WHAT IT DOES AT A GLOBAL LEVEL:
# Looks up one product by its GID and walks through up to five associated media resources.
# Returns fields shared by all media and, through an inline fragment,
# image-specific data when the resource is a MediaImage.

query ProductMedia($productId: ID!) {
  # Entry point for retrieving one specific product.
  product(id: $productId) {
    # Global identifier of the requested product.
    id
    # Product title displayed to customers and merchants.
    title
    # Paginated connection containing the product’s first five media resources.
    media(first: 5) {
      # `nodes` directly contains each media resource.
      nodes {
        # Media type shared by the interface, such as IMAGE, VIDEO, or MODEL_3D.
        mediaContentType
        # Common alternative text for the media, when defined.
        alt
        # Fragment that selects fields only when the concrete type is MediaImage.
        ... on MediaImage {
          # Processed image data, available after Shopify finishes processing it.
          image {
            # CDN URL of the processed image.
            url
            # Image-specific alternative text.
            altText
          }
        }
      }
    }
  }
}
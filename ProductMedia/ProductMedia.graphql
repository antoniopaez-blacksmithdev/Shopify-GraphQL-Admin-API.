# Español 🇪🇸

# QUÉ HACE A NIVEL GLOBAL:
# Busca un producto por su GID y recorre hasta cinco recursos multimedia asociados.
# Devuelve metadatos comunes para todos los medios y, mediante un fragmento inline,
# los datos específicos de la imagen cuando el recurso es un MediaImage.

query ProductMedia($productId: ID!) {
  # Punto de entrada para obtener un producto concreto.
  product(id: $productId) {
    # Identificador global del producto solicitado.
    id
    # Título visible del producto.
    title
    # Conexión paginada con los primeros cinco medios del producto.
    media(first: 5) {
      # `nodes` contiene directamente cada recurso multimedia.
      nodes {
        # Tipo común del medio, como IMAGE, VIDEO o MODEL_3D.
        mediaContentType
        # Texto alternativo común del medio, si fue definido.
        alt
        # Fragmento que selecciona campos solo cuando el tipo concreto es MediaImage.
        ... on MediaImage {
          # Datos procesados de la imagen, disponibles cuando Shopify terminó su procesamiento.
          image {
            # URL CDN de la imagen procesada.
            url
            # Texto alternativo específico de la imagen.
            altText
          }
        }
      }
    }
  }
}


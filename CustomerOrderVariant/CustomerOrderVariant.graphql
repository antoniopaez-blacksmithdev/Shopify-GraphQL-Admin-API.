# Español 🇪🇸

# QUÉ HACE A NIVEL GLOBAL:
# Dado un cliente, recupera sus pedidos y, dentro de cada pedido, desglosa las
# líneas de compra hasta identificar qué variante se compró y a qué producto
# pertenece. Responde a: "¿qué le he vendido a este cliente, en qué talla/color
# y cuántas unidades?".

query CustomerOrderVariant($customerId: ID!) {
  # Carga un cliente por su GID. Requiere el scope read_customers.
  customer(id: $customerId) {
    id
    displayName # Nombre ya formateado (firstName/lastName pueden venir vacíos)

    # Los 5 pedidos del cliente.
    # Admite además: sortKey, reverse, query, after/before/last.
    # sortKey (OrderSortKeys): CREATED_AT | CURRENT_TOTAL_PRICE | CUSTOMER_NAME |
    #   DESTINATION | FINANCIAL_STATUS | FULFILLMENT_STATUS | ID | ORDER_NUMBER |
    #   PO_NUMBER | PROCESSED_AT | RELEVANCE | TOTAL_ITEMS_QUANTITY |
    #   TOTAL_PRICE | UPDATED_AT
    # Para "los 5 últimos": orders(first: 5, sortKey: CREATED_AT, reverse: true)
    # `query` acepta la sintaxis de búsqueda de Shopify, p. ej.:
    #   query: "financial_status:paid created_at:>2026-01-01"
    # RELEVANCE solo tiene sentido si además pasas `query`.
    orders(first: 5) {
      nodes {
        id
        name # Número visible del pedido (#1001), no un título

        # Las líneas del pedido: una por producto comprado.
        lineItems(first: 5) {
          nodes {
            id
            quantity # Unidades VENDIDAS en esta línea (no es stock)

            # Variante concreta comprada.
            # OJO: puede ser null si la variante se eliminó tras la compra;
            # el LineItem conserva entonces solo su nombre como texto histórico.
            variant {
              id
              title

              # Producto padre de la variante. También anulable por lo mismo.
              product {
                id
                title
              }
            }
          }
        }
      }
    }
  }
}

